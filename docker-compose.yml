version: '3.8'

services:
  # ========================================================
  # POSTGRESQL + POSTGIS SPATIAL DATABASE
  # ========================================================
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: crprs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-crprs_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crprs_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crprs-network

  # ========================================================
  # REDIS CACHE, SESSION STORE, AND QUEUES
  # ========================================================
  redis:
    image: redis:7-alpine
    container_name: crprs-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-crprs_redis_secret}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-crprs_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crprs-network

  # ========================================================
  # MINIO S3-COMPATIBLE OBJECT STORAGE (DMS)
  # ========================================================
  minio:
    image: minio/minio:RELEASE.2023-09-07T02-12-53Z
    container_name: crprs-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - crprs-network

  # ========================================================
  # GEOSERVER SPATIAL MAP SERVICE (RECS / GIS)
  # ========================================================
  geoserver:
    image: kartoza/geoserver:2.23.0
    container_name: crprs-geoserver
    restart: unless-stopped
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-geoserver}
      INITIAL_MEMORY: "1G"
      MAXIMUM_MEMORY: "2G"
    ports:
      - "${GEOSERVER_PORT:-8080}:8080"
    volumes:
      - geoserver_data:/opt/geoserver/data_dir
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crprs-network

  # ========================================================
  # MAILHOG (DEVELOPMENT EMAIL TESTING)
  # ========================================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: crprs-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_WEB_PORT:-8025}:8025"
    networks:
      - crprs-network

  # ========================================================
  # BACKEND EXPRESS API SERVICE
  # ========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crprs-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-crprs_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-crprs_jwt_super_secret_key_2026}
      JWT_EXPIRES_IN: 8h
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-crprs_redis_secret}
      CORS_ORIGIN: "http://localhost:5173,http://localhost:3000"
      UPLOAD_DIR: ./uploads
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crprs-network

  # ========================================================
  # FRONTEND REACT APPLICATION SERVICE
  # ========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crprs-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - crprs-network

networks:
  crprs-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  geoserver_data:
  backend_uploads:
